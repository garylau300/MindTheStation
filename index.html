  :root{
    --bg: #121317;
    --panel: #1a1c22;
    --panel-2: #21232b;
    --line-accent: #FFD300;
    --red: #E32017;
    --blue: #113A8F;
    --green: #7CCB6B;
    --ink: #F4F2EA;
    --ink-dim: #9a9ba3;
    --line: #2c2e37;
    --radius: 14px;
  }

  body.light{
    --bg: #F7F5EF;
    --panel: #FFFFFF;
    --panel-2: #EFEDE4;
    --ink: #17181c;
    --ink-dim: #6b6d76;
    --line: #dfdcd2;
    --green: #1E8A46;
  }

  *{ box-sizing: border-box; }

  /* SAFEGUARD: always use this class (via classList.toggle) for JS-driven
     show/hide, never element.style.display directly. An inline style set
     from JS overrides EVERY CSS rule for that element regardless of
     selector specificity — so a hardcoded 'flex'/'block' value here will
     silently keep an element in the wrong layout mode if its CSS is ever
     changed later (e.g. from a flex row to a stacked block), since nobody
     thinks to go find and update the JS. This exact bug shipped once
     already (the Direction/Branch rows stayed flex via inline style after
     their CSS was changed to stack — see the Line/Mode/Direction/Branch
     label consistency fix). Toggling this class instead means the
     "what's the right display value when visible" question is answered
     once, in CSS, by whoever owns the layout — JS just says yes or no. */
  .hidden{ display:none !important; }
  html,body{ margin:0; padding:0; max-width:100%; overflow-x:hidden; }
  body{
    --accent-ink: var(--line-accent);
    background: var(--bg);
    color: var(--ink);
    font-family: 'P22 Underground', 'Cabin', sans-serif;
    min-height: 100vh;
    padding: 28px 16px 60px;
    transition: background-color .2s, color .2s;
  }

  .wrap{ max-width: 720px; margin: 0 auto; }

  header{ margin-bottom: 22px; }
  .roundel-row{ display:flex; align-items:center; gap:12px; margin-bottom: 18px; }
  .roundel{ width: 34px; height: 34px; position:relative; flex:none; }
  .roundel .ring{ position:absolute; inset:0; border-radius:50%; border: 5px solid var(--red); }
  .roundel .bar{ position:absolute; left:-3px; right:-3px; top:50%; height: 8px; background: var(--blue); transform: translateY(-50%); }

<script>
(function(){
  // ---------------------------------------------------------------
  // Line data. Each line defines its own unique stations, in real
  // geographic order, plus how its diagram should be laid out and
  // any "loop closure" — extra stops appended to represent a real
  // service pattern that revisits a station (like Circle's spiral
  // closing back through Paddington/Edgware Road).
  // ---------------------------------------------------------------
  // ---------------------------------------------------------------
  // Station interchanges: which other lines/services connect at each
  // station. Keyed by station NAME (not by line), since a station like
  // King's Cross St. Pancras appears in several lines' data — this way
  // the fact is recorded once and any line can look it up. Only Victoria
  // line's 16 stations are populated for now; anything not listed here
  // just renders no badges rather than erroring.
  //
  // London Overground badges use the specific one of the six 2024-renamed
  // lines (Liberty/Lioness/Mildmay/Suffragette/Weaver/Windrush) rather than
  // a generic Overground badge. Colours are TfL's official Pantone-derived

  // National Rail is still one generic badge (no single official colour,
  // and its double-arrow logo is a registered mark we won't reproduce).
  // ---------------------------------------------------------------
  const LINE_BADGE_COLORS = {
    bakerloo: '#B36305', central: '#E32017', circle: '#FFD300', district: '#00782A',
    hammersmithcity: '#F3A9BB', jubilee: '#A0A5A9', metropolitan: '#9B0056',
    northern: '#000000', piccadilly: '#003688', victoria: '#0098D4',
    waterloocity: '#95CDBA', elizabeth: '#6950A1', dlr: '#00A4A7',
    nationalrail: '#4A4A4A',
    liberty: '#5D6061', lioness: '#FAA61A', mildmay: '#0077AD',
    suffragette: '#5BBD72', weaver: '#823A62', windrush: '#ED1B00'
  };
  function badge(id, label){ return { color: LINE_BADGE_COLORS[id], label }; }

  const STATION_INTERCHANGES = {
    "Brixton": [badge('nationalrail','National Rail')],
    "Stockwell": [badge('northern','Northern')],
    "Vauxhall": [badge('nationalrail','National Rail')],
    "Pimlico": [],
    "Victoria": [badge('circle','Circle'), badge('district','District'), badge('nationalrail','National Rail')],
    "Green Park": [badge('piccadilly','Piccadilly'), badge('jubilee','Jubilee')],
    "Oxford Circus": [badge('central','Central'), badge('bakerloo','Bakerloo')],
    "Warren Street": [badge('northern','Northern')],
    "Euston": [badge('northern','Northern'), badge('nationalrail','National Rail')],
    "King's Cross St. Pancras": [badge('circle','Circle'), badge('hammersmithcity',"H&C"), badge('metropolitan','Metropolitan'), badge('northern','Northern'), badge('piccadilly','Piccadilly'), badge('nationalrail','National Rail')],
    "Highbury & Islington": [badge('mildmay','Mildmay'), badge('windrush','Windrush'), badge('nationalrail','National Rail')],
    "Finsbury Park": [badge('piccadilly','Piccadilly'), badge('nationalrail','National Rail')],
    "Seven Sisters": [badge('weaver','Weaver'), badge('nationalrail','National Rail')],
    "Tottenham Hale": [badge('nationalrail','National Rail')],
    "Blackhorse Road": [badge('suffragette','Suffragette')],
    "Walthamstow Central": [badge('weaver','Weaver'), badge('nationalrail','National Rail')]
  };

  const LINES = {
    circle: {
      id: 'circle',
      label: 'Circle',
      color: '#FFD300',
      layout: 'spur-loop',
      spurCount: 8, // Hammersmith..Royal Oak
      loopClosure: [8, 9], // journey repeats Paddington, then Edgware Road, to close the spiral
      stations: [
        "Hammersmith","Goldhawk Road","Shepherd's Bush Market","Wood Lane","Latimer Road",
        "Ladbroke Grove","Westbourne Park","Royal Oak","Paddington","Edgware Road",
        "Baker Street","Great Portland Street","Euston Square","King's Cross St. Pancras","Farringdon",
        "Barbican","Moorgate","Liverpool Street","Aldgate","Tower Hill",
        "Monument","Cannon Street","Mansion House","Blackfriars","Temple",
        "Embankment","Westminster","St. James's Park","Victoria","Sloane Square",
        "South Kensington","Gloucester Road","High Street Kensington","Notting Hill Gate","Bayswater"
      ]
    },
    victoria: {
      id: 'victoria',
      label: 'Victoria',
      color: '#0098D4',
      layout: 'linear',
      spurCount: 0,
      loopClosure: [],
      stations: [
        "Brixton","Stockwell","Vauxhall","Pimlico","Victoria",

        "Ladbroke Grove","Westbourne Park","Royal Oak","Paddington","Edgware Road",
        "Baker Street","Great Portland Street","Euston Square","King's Cross St. Pancras","Farringdon",

        "Stepney Green","Mile End","Bow Road","Bromley-by-Bow","West Ham",
        "Plaistow","Upton Park","East Ham","Barking"
      ]
    },
    // District's real service pattern is four specific through-routes,
    // not "any western branch to any eastern end": Ealing Broadway and
    // Richmond both run to Upminster; Wimbledon splits into a Barking
    // service and a separate Edgware Road service (via the same fork
    // at Gloucester Road that Circle/H&C use). Modeled here as a tree
    // of segments (trunk + arms) so the diagram can show the actual
    // branch shape, not just whichever route happens to be selected.
    // Kensington (Olympia) is deliberately left out — documented as a
    // "limited service" branch with its own unusual pattern, so it's a
    // separate judgment call rather than data to guess at.
    district: (function(){
      const ealingArm = ["Chiswick Park","Acton Town","Ealing Common","Ealing Broadway"];
      const westCore = ["West Kensington","Barons Court","Hammersmith","Ravenscourt Park","Stamford Brook","Turnham Green"];
      const trunk = ["Earl's Court","Gloucester Road"];

      // simple vertical stub connecting perpendicular to it at the real
      // junction — Turnham Green, Earl's Court, and Gloucester Road — rather
      // than diagonal "spider legs" going off at odd angles
      const spine = [...ealingArm.slice().reverse(), ...westCore.slice().reverse(), ...trunk, ...eastCore, ...upminsterExt];
      const turnhamGreenIdx = spine.indexOf('Turnham Green');
      const earlsCourtIdx = spine.indexOf("Earl's Court");
      const gloucesterRoadIdx = spine.indexOf('Gloucester Road');

      const segments = [
        { id:'spine', stations: spine, parent:null, dx:1, dy:0, spacing:16, startX:60, startY:250 },
        { id:'richmondArm', stations: richmondArm, parent:'spine', parentIndex: turnhamGreenIdx, dx:0, dy:-1, spacing:26 },
        { id:'wimbledonArm', stations: wimbledonArm, parent:'spine', parentIndex: earlsCourtIdx, dx:0, dy:1, spacing:26 },
        { id:'edgwareArm', stations: edgwareArm, parent:'spine', parentIndex: gloucesterRoadIdx, dx:0, dy:-1, spacing:26 }
      ];

      return {
        id: 'district',
        label: 'District',
        color: '#00782A',
        layout: 'branch-tree',
        segments: segments,
        spurCount: 0,
        loopClosure: [],
        defaultBranch: 'ealingUpminster',
        branches: {
          ealingUpminster: {
            label: 'Ealing Broadway – Upminster',
            stations: spine
          },
          richmondUpminster: {
            label: 'Richmond – Upminster',
            stations: [...richmondArm.slice().reverse(), ...westCore.slice().reverse(), ...trunk, ...eastCore, ...upminsterExt]
          },
          wimbledonBarking: {
            label: 'Wimbledon – Barking',
            stations: [...wimbledonArm.slice().reverse(), ...trunk, ...eastCore]
          },
          wimbledonEdgware: {
            label: 'Wimbledon – Edgware Road',
            stations: [...wimbledonArm.slice().reverse(), ...trunk, ...edgwareArm]
          }
        }
      };
    })(),
    // secret: "The Drain" — Londoners' nickname for Waterloo & City, on
    // account of its short, single-tunnel run between just two stations.
    // Not listed anywhere in the UI; found only via the hidden footer egg.
    waterloocity: {
      id: 'waterloocity',
      label: 'Waterloo & City',
      color: '#95CDBA',
      layout: 'linear',
      spurCount: 0,
      loopClosure: [],
      stations: ["Waterloo", "Bank"]
    }
  };

  // ---- Build the derived runtime data for a line (journey sequence,
  // reversed variants, etc) from its static definition ----
  function buildLineRuntime(id, branchId){
    const def = LINES[id];
    const hasBranches = !!def.branches;
    const activeBranchId = hasBranches ? (branchId || def.defaultBranch) : null;
    const stations = hasBranches ? def.branches[activeBranchId].stations : def.stations;
    const N = stations.length;
    const journeyIndices = [...Array(N).keys(), ...def.loopClosure];
    const reversedJourneyIndices = journeyIndices.slice().reverse();
    const journeyNames = journeyIndices.map(i => stations[i]);
    const reversedJourneyNames = reversedJourneyIndices.map(i => stations[i]);
    return {
      def, stations, N, branchId: activeBranchId,
      journeyIndices, reversedJourneyIndices, journeyNames, reversedJourneyNames,
      JOURNEY_LEN: journeyIndices.length
    };
  }

  // ---- Small color utility: derive a readable "ink" (text) variant
  // of a line's brand color for light mode, since a color bright
  // enough to read on a dark background (like Circle's yellow) is
  // often too low-contrast to read as text on white ----
  function hexToRgb(hex){
    const h = hex.replace('#','');
    return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
  }
  function rgbToHex(r,g,b){
    return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  }
  function darkenForLightMode(hex){
    const {r,g,b} = hexToRgb(hex);
    const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
    // bright colors (like Circle's yellow) need heavy darkening to read
    // as text on white; already-dark colors just get a mild safety margin
    const factor = luminance > 0.6 ? 0.45 : 0.85;
    return rgbToHex(r*factor, g*factor, b*factor);
  }

  // for interchange pills filled solid with a line's own color: pick
  // whichever of near-black/near-white text actually reads on it
  function readableTextOn(hex){
    const {r,g,b} = hexToRgb(hex);
    const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
    return luminance > 0.6 ? '#14151a' : '#f5f4ef';
  }

  let LINE = buildLineRuntime('circle');

  const $ = id => document.getElementById(id);
  const answerInput = $('answerInput');
  const feedback = $('feedback');
  const contextLine = $('contextLine');
  const promptLine = $('promptLine');
  const targetWord = $('targetWord');
  const inputRow = $('inputRow');
  const mcOptionsEl = $('mcOptions');
  const mcContextCard = $('mcContextCard');
  const mcContextRow = $('mcContextRow');
  const interchangeRow = $('interchangeRow');
  // cached once here rather than re-queried on every call — several of
  // these (statMid, gameArea, liveDot) are touched by the 500ms tick timer,
  // so avoiding a fresh getElementById each time is a real (if small) win
  const gameAreaEl = $('gameArea');
  const summaryAreaEl = $('summaryArea');
  const summaryTitleEl = $('summaryTitle');
  const summarySubEl = $('summarySub');
  const statMidEl = $('statMid');
  const statBestEl = $('statBest');
  const statTimeEl = $('statTime');
  const liveDotEl = $('liveDot');
  const hintBtnEl = $('hintBtn');
  const themeToggleEl = $('themeToggle');
  const modeWarmupBtnEl = $('modeWarmupBtn');
  const modeQuizBtnEl = $('modeQuizBtn');
  const modeMcBtnEl = $('modeMcBtn');
  const directionForwardBtnEl = $('directionForwardBtn');
  const directionReverseBtnEl = $('directionReverseBtn');

  let isLight = true;
  let mode = 'warmup'; // 'warmup' | 'quiz' | 'mc'
  let reverseDirection = false; // only applies to warmup / quiz
  let idx = 0;
  let streak = 0, bestStreak = 0, correctCount = 0, attempts = 0;
  let misses = [];
  let startTime = null, charsTyped = 0, bestWpm = 0;
  let wpmTimer = null;
  let mcOrder = [];         // shuffled true-station-indices, one per MC question
  // per-station outcome, keyed by true geographic index: 'ok' | 'bad'
  let results = {};

  function normalize(s){
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  }

  function popCard(){
    const card = $('gameCard');
    card.classList.remove('pop');
    void card.offsetWidth;
    card.classList.add('pop');
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  // active ordered list for the current mode/direction — multiple choice
  // uses its own randomized order (see mcOrder) rather than this
  function seq(){
    return (mode !== 'mc' && reverseDirection) ? LINE.reversedJourneyNames : LINE.journeyNames;
  }

  // maps a position in seq() back to its true geographic index, for the diagram
  function origIndex(i){
    return (mode !== 'mc' && reverseDirection) ? LINE.reversedJourneyIndices[i] : LINE.journeyIndices[i];
  }

  // the mode-aware run length: the full journey for warm-up/quiz
  // (which may include repeat stops), or one question per unique
  // station for MC
  function totalSteps(){
    return mode === 'mc' ? LINE.N : LINE.JOURNEY_LEN;
  }

  // the true geographic index of whatever question is currently showing
  function currentTargetIndex(){
    if(mode === 'mc') return mcOrder[idx];
    return origIndex(idx);
  }

  function resetState(){
    idx = 0; streak = 0; correctCount = 0; attempts = 0; misses = [];
    startTime = null; charsTyped = 0; results = {};
    if(mode === 'mc') mcOrder = shuffle([...Array(LINE.N).keys()]);
    statTimeEl.textContent = '0:00';
    liveDotEl.classList.remove('ticking');
    summaryAreaEl.classList.add('hidden');
    gameAreaEl.classList.remove('hidden');
  }

  function applyLineTheme(){
    document.body.style.setProperty('--line-accent', LINE.def.color);
    document.body.style.setProperty('--accent-ink', isLight ? darkenForLightMode(LINE.def.color) : LINE.def.color);
  }

  function terminusNames(){
    // the true start and end of a forward run through this line
    const start = LINE.stations[LINE.journeyIndices[0]];
    const end = LINE.stations[LINE.journeyIndices[LINE.JOURNEY_LEN - 1]];
    return { start, end };
  }

  function updateDirectionLabels(){
    const { start, end } = terminusNames();
    directionForwardBtnEl.textContent = start + ' → ' + end;
    directionReverseBtnEl.textContent = end + ' → ' + start;
  }

  function renderBranchRow(){
    const row = $('branchRow');
    const hasBranches = !!LINE.def.branches;
    row.classList.toggle('hidden', !hasBranches);
    if(!hasBranches) return;
    const group = $('branchGroup');
    group.innerHTML = '';
    Object.keys(LINE.def.branches).forEach(branchId => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'direction-btn';
      if(branchId === LINE.branchId) btn.classList.add('active');
      btn.textContent = LINE.def.branches[branchId].label;
      btn.addEventListener('click', function(){ setBranch(branchId); });
      group.appendChild(btn);
    });
  }

  function setBranch(branchId){
    if(branchId === LINE.branchId) return;
    LINE = buildLineRuntime(LINE.def.id, branchId);
    reverseDirection = false;
    directionForwardBtnEl.classList.add('active');
    directionReverseBtnEl.classList.remove('active');
    renderBranchRow();
    updateDirectionLabels();
    setupGeometry();
    resetState();
    render();
  }

  function setLine(id){
    if(!LINES[id] || id === LINE.def.id){
      // still allow re-selecting the same line to just reset it
      if(!LINES[id]) return;
    }
    LINE = buildLineRuntime(id);
    reverseDirection = false;
    directionForwardBtnEl.classList.add('active');
    directionReverseBtnEl.classList.remove('active');
    document.querySelectorAll('.line-select .pill[id^="line"]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lineId === id);
    });
    $('lineNameSpan').textContent = LINE.def.label;
    document.title = LINE.def.label + ' Line — Underground Explorer';
    renderBranchRow();
    updateDirectionLabels();
    applyLineTheme();
    setupGeometry();
    setMode('warmup');
  }

  function setDirection(rev){
    if(mode === 'mc') return;
    reverseDirection = rev;
    directionForwardBtnEl.classList.toggle('active', !reverseDirection);
    directionReverseBtnEl.classList.toggle('active', reverseDirection);
    resetState();
    render();
  }

  function setMode(newMode){
    mode = newMode;
    modeWarmupBtnEl.classList.toggle('active', mode === 'warmup');
    modeQuizBtnEl.classList.toggle('active', mode === 'quiz');
    modeMcBtnEl.classList.toggle('active', mode === 'mc');
    $('statMidLabel').textContent = mode === 'warmup' ? 'WPM' : 'Streak';
    $('statBestLabel').textContent = mode === 'warmup' ? 'Best WPM' : 'Best streak';
    promptLine.classList.toggle('hidden', mode !== 'quiz');
    targetWord.classList.toggle('hidden', mode !== 'warmup');
    inputRow.classList.toggle('hidden', mode === 'mc');
    mcOptionsEl.classList.toggle('hidden', mode !== 'mc');
    mcContextCard.classList.toggle('hidden', mode !== 'mc');
    $('directionRow').classList.toggle('hidden', mode === 'mc');
    hintBtnEl.classList.toggle('hidden', mode === 'warmup');
    $('rowActions').classList.toggle('single', mode === 'warmup');
    resetState();
    render();
  }

  function currentWpm(){
    if(!startTime) return 0;
    const minutes = (Date.now() - startTime) / 60000;
    if(minutes <= 0) return 0;
    return Math.round((charsTyped / 5) / minutes);
  }

  function formatElapsed(){
    if(!startTime) return '0:00';
    const totalSec = Math.max(0, Math.round((Date.now() - startTime) / 1000));
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function updateStats(){
    $('statProgress').textContent = idx + '/' + totalSteps();
    $('statAcc').textContent = attempts ? Math.round(100*correctCount/attempts) + '%' : '—';
    if(mode === 'warmup'){
      statMidEl.textContent = currentWpm();
      statBestEl.textContent = bestWpm;
    } else {
      statMidEl.textContent = streak;
      statBestEl.textContent = bestStreak;
    }
  }

  function renderInterchanges(stationName){
    const list = STATION_INTERCHANGES[stationName];
    interchangeRow.innerHTML = '';
    if(!list || list.length === 0){
      interchangeRow.classList.add('hidden');
      return;
    }
    interchangeRow.classList.remove('hidden');
    list.forEach(({color, label}) => {
      const chip = document.createElement('span');
      chip.className = 'interchange-chip';
      chip.style.background = color;
      chip.style.color = readableTextOn(color);
      chip.textContent = label;
      interchangeRow.appendChild(chip);
    });
  }

  function generateMcOptions(correctIdx){
    const pool = [];
    for(let i=0;i<LINE.N;i++){ if(i !== correctIdx) pool.push(i); }
    shuffle(pool);
    const distractors = pool.slice(0, 3);
    return shuffle([correctIdx, ...distractors]);
  }

  function renderMcContext(targetIdx){
    mcContextRow.innerHTML = '';
    const offsets = [-1, 0, 1];
    // targetIdx's position in the real journey is just targetIdx itself,
    // since journeyIndices[0..N-1] is the identity map (any repeat pair
    // only appears again past position N-1) — walking from there lets
    // "next" correctly wrap around a real loop closure instead of just
    // running off the end of the list
    offsets.forEach((off, pos) => {
      if(pos > 0){
        const connector = document.createElement('div');
        connector.className = 'mc-context-connector';
        mcContextRow.appendChild(connector);
      }
      const journeyPos = targetIdx + off;
      const i = (journeyPos >= 0 && journeyPos < LINE.JOURNEY_LEN) ? LINE.journeyIndices[journeyPos] : -1;
      const node = document.createElement('div');
      if(i < 0){
        node.className = 'mc-context-node empty';
        node.textContent = '—';
      } else if(off === 0){
        node.className = 'mc-context-node blank';
        node.textContent = '?';
      } else {
        node.className = 'mc-context-node';
        node.textContent = LINE.stations[i];
      }
      mcContextRow.appendChild(node);
    });
  }

  function renderMcOptions(){
    const correctIdx = mcOrder[idx];
    const optionIdxs = generateMcOptions(correctIdx);
    mcOptionsEl.innerHTML = '';
    optionIdxs.forEach(optIdx => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mc-option';
      btn.textContent = LINE.stations[optIdx];
      btn.addEventListener('click', function(){ handleMcAnswer(btn, optIdx, correctIdx); });
      mcOptionsEl.appendChild(btn);
    });
  }

  function handleMcAnswer(btn, optIdx, correctIdx){
    const allBtns = Array.from(mcOptionsEl.querySelectorAll('.mc-option'));
    allBtns.forEach(b => b.classList.add('disabled'));
    if(!startTime) startTime = Date.now();
    attempts++;

    if(optIdx === correctIdx){
      correctCount++;
      streak++;
      bestStreak = Math.max(bestStreak, streak);
      results[correctIdx] = 'ok';
      popCard();
      btn.classList.remove('disabled');
      btn.classList.add('correct');
      feedback.className = 'feedback ok';
      feedback.textContent = '✓ Correct — ' + LINE.stations[correctIdx];
      updateStats();
      drawDiagram();
      setTimeout(advance, 550);
    } else {
      streak = 0;
      results[correctIdx] = 'bad';
      misses.push({you: LINE.stations[optIdx], correct: LINE.stations[correctIdx]});
      btn.classList.add('wrong');
      allBtns.forEach(b => { if(b.textContent === LINE.stations[correctIdx]) b.classList.add('correct'); });
      feedback.className = 'feedback bad';
      feedback.textContent = '✕ It was — ' + LINE.stations[correctIdx];
      updateStats();
      drawDiagram();
      setTimeout(advance, 1100);
    }
  }

  function render(shouldFocus){
    answerInput.value = '';
    answerInput.className = '';
    feedback.textContent = '';
    feedback.className = 'feedback';

    const list = seq();
    const { start, end } = terminusNames();

    if(mode === 'warmup'){
      const dir = reverseDirection ? ' · reverse' : '';
      const isRepeatVisit = list.slice(0, idx).includes(list[idx]);
      const note = isRepeatVisit ? ' · loop closes back through here' : '';
      contextLine.innerHTML = 'Stop ' + (idx+1) + ' of ' + LINE.JOURNEY_LEN + dir + note;
      targetWord.textContent = list[idx];
      answerInput.placeholder = 'Type it exactly…';
      renderInterchanges(list[idx]);
    } else if(mode === 'quiz'){
      interchangeRow.classList.add('hidden');
      if(idx === 0){
        contextLine.innerHTML = reverseDirection
          ? end + ' — the terminus, where trains reverse'
          : start + ' — where the line begins';
        promptLine.innerHTML = 'Type the <em>first</em> station' + (reverseDirection ? ' in reverse:' : ':');
      } else {
        const isRepeatVisit = list.slice(0, idx).includes(list[idx]);
        const note = isRepeatVisit ? ' <span class="repeat-note">(loop closes back through here)</span>' : '';
        contextLine.innerHTML = 'Previous: <b>' + list[idx-1] + '</b>' + note;
        promptLine.innerHTML = 'What\'s the <em>next</em> station?';
      }
      answerInput.placeholder = 'Type a station name…';
    } else if(mode === 'mc'){
      interchangeRow.classList.add('hidden');
      const targetIdx = mcOrder[idx];
      contextLine.innerHTML = '';
      renderMcOptions();
      renderMcContext(targetIdx);
    }
    updateStats();
    drawDiagram();
    // only pull focus (and pop the mobile keyboard) when continuing an
    // active typing flow — never on a fresh line/mode/direction switch,
    // where the person hasn't necessarily chosen to type yet
    if(shouldFocus && mode !== 'mc') answerInput.focus();
  }

  function finishRun(){
    updateStats();
    gameAreaEl.classList.add('hidden');
    const area = summaryAreaEl;
    area.classList.remove('hidden');
    const acc = attempts ? Math.round(100*correctCount/attempts) : 0;
    const elapsed = formatElapsed();
    const summaryTime = $('summaryTime');
    if(startTime){
      summaryTime.classList.remove('hidden');
      $('summaryTimeValue').textContent = elapsed;
    } else {
      summaryTime.classList.add('hidden');
    }
    const hasClosure = LINE.def.loopClosure.length > 0;
    const closureNote = hasClosure
      ? ' (' + LINE.N + ' stations, ' + LINE.def.loopClosure.map(i => LINE.stations[i]).join(' and ') + ' each twice)'
      : ' (' + LINE.N + ' stations)';
    if(mode === 'warmup'){
      const wpm = currentWpm();
      bestWpm = Math.max(bestWpm, wpm);
      summaryTitleEl.textContent = 'Warm-up complete';
      summarySubEl.textContent = 'Typed the full ' + LINE.JOURNEY_LEN + '-stop journey' + closureNote + ' at ' + wpm + ' WPM · ' + acc + '% first-try accuracy. Try the recall quiz next.';
    } else if(mode === 'quiz'){
      summaryTitleEl.textContent = misses.length === 0 ? 'Full journey, zero mistakes' : 'Quiz complete';
      summarySubEl.textContent = 'You got ' + correctCount + ' of ' + LINE.JOURNEY_LEN + ' stops right first-try · ' + acc + '% accuracy · best streak ' + bestStreak + '.';
    } else {
      summaryTitleEl.textContent = misses.length === 0 ? 'Perfect round' : 'Multiple choice complete';
      summarySubEl.textContent = 'You got ' + correctCount + ' of ' + LINE.N + ' right first-try · ' + acc + '% accuracy · best streak ' + bestStreak + '.';
    }
    const list = $('missList');
    list.innerHTML = '';
    if(misses.length === 0){
      const li = document.createElement('li');
      li.textContent = 'Every station landed. Nice.';
      list.appendChild(li);
    } else {
      misses.forEach(m=>{
        const li = document.createElement('li');
        const youSpan = document.createElement('span');
        youSpan.className = 'you';
        youSpan.textContent = m.you || '(skipped)';
        const correctSpan = document.createElement('span');
        correctSpan.className = 'correct';
        correctSpan.textContent = m.correct;
        li.appendChild(youSpan);
        li.appendChild(correctSpan);
        list.appendChild(li);
      });
    }
    drawDiagram();
  }

  function advance(){
    idx++;
    if(idx >= totalSteps()){ finishRun(); } else { render(true); }
  }

  function submitAnswer(){
    if(mode === 'mc') return; // handled via option buttons
    const val = answerInput.value.trim();
    if(!val) return;
    if(!startTime) startTime = Date.now();
    attempts++;

    const list = seq();
    const trueIdx = origIndex(idx);
    const isRight = normalize(val) === normalize(list[idx]);
    if(isRight){
      correctCount++;
      streak++;
      bestStreak = Math.max(bestStreak, streak);
      charsTyped += list[idx].length + 1;
      results[trueIdx] = 'ok';
      if(mode === 'quiz') popCard();
      answerInput.className = 'right';
      feedback.className = 'feedback ok';
      feedback.textContent = '✓ Correct — ' + list[idx];
      updateStats();
      drawDiagram();
      setTimeout(advance, mode === 'warmup' ? 200 : 450);
    } else {
      streak = 0;
      results[trueIdx] = 'bad';
      misses.push({you: val, correct: list[idx]});
      answerInput.className = 'wrong';
      feedback.className = 'feedback bad';
      feedback.textContent = '✕ It was — ' + list[idx];
      updateStats();
      drawDiagram();
      setTimeout(advance, 900);
    }
  }

  $('submitBtn').addEventListener('click', submitAnswer);
  answerInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); submitAnswer(); }
  });
  answerInput.addEventListener('input', function(){
    // stopwatch starts the moment they type their first character,
    // not when they eventually submit it
    if(!startTime && answerInput.value.length > 0){
      startTime = Date.now();
    }
  });

  hintBtnEl.addEventListener('click', function(){
    const list = seq();
    if(mode === 'mc'){
      streak = Math.max(0, streak - 1);
      const correctName = LINE.stations[mcOrder[idx]];
      const wrongBtns = Array.from(mcOptionsEl.querySelectorAll('.mc-option'))
        .filter(b => b.textContent !== correctName && !b.classList.contains('disabled'));
      if(wrongBtns.length){
        wrongBtns[Math.floor(Math.random()*wrongBtns.length)].classList.add('disabled');
        feedback.className = 'feedback';
        feedback.textContent = 'Eliminated one wrong option.';
      }
      updateStats();
      return;
    }
    streak = Math.max(0, streak - 1);
    const len = list[idx].length;
    const reveal = Math.min(len - 1, Math.max(2, Math.round(len*0.35)));
    feedback.className = 'feedback';
    feedback.textContent = 'Hint: starts with "' + list[idx].slice(0, reveal) + '…" (' + len + ' letters)';
    updateStats();
    answerInput.focus();
  });

  $('skipBtn').addEventListener('click', function(){
    const list = seq();
    if(!startTime) startTime = Date.now();
    attempts++;
    streak = 0;
    if(mode === 'mc'){
      const correctIdx = mcOrder[idx];
      const correctName = LINE.stations[correctIdx];
      results[correctIdx] = 'bad';
      misses.push({you: '(skipped)', correct: correctName});
      Array.from(mcOptionsEl.querySelectorAll('.mc-option')).forEach(b=>{
        b.classList.add('disabled');
        if(b.textContent === correctName) b.classList.add('correct');
      });
      feedback.className = 'feedback bad';
      feedback.textContent = 'Skipped — ' + correctName;
      updateStats();
      drawDiagram();
      setTimeout(advance, 700);
      return;
    }
    results[origIndex(idx)] = 'bad';
    misses.push({you: answerInput.value.trim(), correct: list[idx]});
    feedback.className = 'feedback bad';
    feedback.textContent = 'Skipped — ' + list[idx];
    updateStats();
    drawDiagram();
    setTimeout(advance, 500);
  });

  $('restartBtn').addEventListener('click', function(){
    resetState();
    render();
  });

  modeWarmupBtnEl.addEventListener('click', function(){ setMode('warmup'); });
  modeQuizBtnEl.addEventListener('click', function(){ setMode('quiz'); });
  modeMcBtnEl.addEventListener('click', function(){ setMode('mc'); });

  directionForwardBtnEl.addEventListener('click', function(){ setDirection(false); });
  directionReverseBtnEl.addEventListener('click', function(){ setDirection(true); });

  $('lineCircleBtn').addEventListener('click', function(){ setLine('circle'); });
  $('lineVictoriaBtn').addEventListener('click', function(){ setLine('victoria'); });
  $('lineJubileeBtn').addEventListener('click', function(){ setLine('jubilee'); });
  $('lineBakerlooBtn').addEventListener('click', function(){ setLine('bakerloo'); });
  $('lineHcBtn').addEventListener('click', function(){ setLine('hammersmithcity'); });
  $('lineDistrictBtn').addEventListener('click', function(){ setLine('district'); });

  // ---- secret: "The Drain" ----
  // a nearly-invisible drain-cover dot hides in the footer; clicking it
  // reveals Waterloo & City as a proper pill (so it's easy to return to
  // once found) and jumps straight into it
  let drainUnlocked = false;
  let eggToastTimer = null;
  function showEggToast(html){
    const toast = $('eggToast');
    toast.innerHTML = html;
    toast.classList.add('show');
    clearTimeout(eggToastTimer);
    eggToastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 3200);
  }
  $('drainEgg').addEventListener('click', function(){
    if(!drainUnlocked){
      drainUnlocked = true;
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'pill';
      pill.id = 'lineWaterlooCityBtn';
      pill.dataset.lineId = 'waterloocity';
      pill.textContent = '● Waterloo & City — 2 stations';
      pill.addEventListener('click', function(){ setLine('waterloocity'); });
      document.querySelector('.line-select').appendChild(pill);
    }
    setLine('waterloocity');
    showEggToast('🕳️ Found <b>The Drain</b> — Waterloo &amp; City unlocked');
  });

  // ---- secret: Kensington (Olympia) ----
  // District's genuine "ghost" branch — real, but so rarely timetabled
  // that Wikipedia itself calls it "limited service". Hidden as a small
  // dot in the Branch row (only visible once District is selected),
  // separate from the drain egg since this is a quirk of one line
  // rather than a whole hidden line of its own.
  let olympiaUnlocked = false;
  $('olympiaEgg').addEventListener('click', function(){
    if(LINE.def.id !== 'district') return;
    if(!olympiaUnlocked){
      olympiaUnlocked = true;
      const def = LINES.district;
      def.segments.push({
        id: 'olympiaArm', stations: ["Kensington (Olympia)"],
        parent: 'spine', parentIndex: def.segments.find(s => s.id === 'spine').stations.indexOf("Earl's Court"),
        dx: 0, dy: -1, spacing: 26
      });
      const edgwareArm = def.segments.find(s => s.id === 'edgwareArm').stations;
      const trunk = ["Earl's Court", "Gloucester Road"];
      def.branches.kensingtonOlympia = {
        label: 'Kensington (Olympia) – Edgware Road',
        stations: ["Kensington (Olympia)", ...trunk, ...edgwareArm]
      };
    }
    setBranch('kensingtonOlympia');
    showEggToast('👻 Found the <b>ghost branch</b> — Kensington (Olympia) unlocked');
  });

  themeToggleEl.addEventListener('click', function(){
    isLight = !isLight;
    document.body.classList.toggle('light', isLight);
    themeToggleEl.textContent = isLight ? '☀ Light' : '☾ Dark';
    applyLineTheme();
    drawDiagram();
  });

  if(wpmTimer) clearInterval(wpmTimer);
  wpmTimer = setInterval(function(){
    const running = startTime && !gameAreaEl.classList.contains('hidden');
    if(mode === 'warmup' && running){
      statMidEl.textContent = currentWpm();
    }
    if(running){
      statTimeEl.textContent = formatElapsed();
      liveDotEl.classList.add('ticking');
    } else {
      liveDotEl.classList.remove('ticking');
    }
  }, 500);

  // ---------------------------------------------------------------
  // Diagram geometry. Each line's layout type gets its own bespoke
  // shape rather than forcing every line into one generic template —
  // Circle keeps its literal spur + closed loop; a simple point-to-
  // point line like Victoria gets a clean horizontal run instead.
  // ---------------------------------------------------------------
  const svg = $('lineSvg');
  let geo = null; // populated by setupGeometry()

  function setupGeometry(){
    const layout = LINE.def.layout;

    if(layout === 'spur-loop'){
      const cx = 270, cy = 130, r = 75;
      const spurCount = LINE.def.spurCount;
      const spurBaseX = cx - r;
      const loopN = LINE.N - spurCount;
      // match spur spacing to the loop's chord length so every station-to-
      // station gap in the diagram reads as visually equal
      const spurSpacing = 2 * r * Math.sin(Math.PI / loopN);

      geo = {
        viewBox: '0 0 400 260',
        labelX: cx, labelYMain: cy - 4, labelYSub: cy + 16,
        labelFontSize: 28, subLabelFontSize: 10,
        hasClosingSegment: true,
        closingPair: [LINE.N - 1, spurCount],
        stationPos(i){
          if(i < spurCount){
            const k = (spurCount - 1) - i;
            return { x: spurBaseX - (k+1)*spurSpacing, y: cy };
          }
          const j = i - spurCount;
          const angleDeg = 180 + (j / loopN) * 360;
          const angle = angleDeg * Math.PI / 180;
          return { x: cx + r*Math.cos(angle), y: cy + r*Math.sin(angle) };
        },
        outwardDir(i){
          if(i < spurCount) return { dx: 0, dy: -1 };
          const j = i - spurCount;
          const angleDeg = 180 + (j / loopN) * 360;
          const angle = angleDeg * Math.PI / 180;
          return { dx: Math.cos(angle), dy: Math.sin(angle) };
        },
        emphasisIndex: spurCount // Paddington: slightly larger dot, the spur/loop junction
      };
    } else if(layout === 'branch-tree'){
      const segmentDefs = LINE.def.segments;
      const byId = {};
      segmentDefs.forEach(s => byId[s.id] = s);
      const globalPositions = {};
      const outwardByName = {};
      const segmentPositions = {};
      const networkEdges = [];

      function getSegPos(segId){
        if(segmentPositions[segId]) return segmentPositions[segId];
        const seg = byId[segId];
        const len = Math.hypot(seg.dx, seg.dy);
        const ndx = seg.dx/len, ndy = seg.dy/len;
        // perpendicular to the segment's own direction, for tick-mark placement
        const outward = { dx: -ndy, dy: ndx };
        const positions = [];
        let x, y;
        if(seg.parent === null){
          x = seg.startX; y = seg.startY;
          positions.push({x,y});
          for(let i=1;i<seg.stations.length;i++){
            x += ndx*seg.spacing; y += ndy*seg.spacing;
            positions.push({x,y});
            networkEdges.push([positions[i-1], positions[i]]);
          }
        } else {
          const parentPositions = getSegPos(seg.parent);
          const attach = parentPositions[seg.parentIndex];
          x = attach.x; y = attach.y;
          for(let i=0;i<seg.stations.length;i++){
            x += ndx*seg.spacing; y += ndy*seg.spacing;
            positions.push({x,y});
            networkEdges.push([i === 0 ? attach : positions[i-1], positions[i]]);
          }
        }
        segmentPositions[segId] = positions;
        seg.stations.forEach((name, idx) => {
          globalPositions[name] = positions[idx];
          outwardByName[name] = outward;
        });
        return positions;
      }
      segmentDefs.forEach(s => getSegPos(s.id));

      const xs = Object.values(globalPositions).map(p => p.x);
      const ys = Object.values(globalPositions).map(p => p.y);
      const pad = 45;
      const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
      const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;

      geo = {
        viewBox: minX + ' ' + minY + ' ' + (maxX-minX) + ' ' + (maxY-minY),
        labelX: 450, labelYMain: 336, labelYSub: 360,
        labelFontSize: 42, subLabelFontSize: 15,
        hasClosingSegment: false,
        closingPair: null,
        networkEdges: networkEdges,
        networkStations: Object.entries(globalPositions).map(([name,p]) => ({ name, x:p.x, y:p.y })),
        stationPos(i){ return globalPositions[LINE.stations[i]]; },
        outwardDir(i){ return outwardByName[LINE.stations[i]] || { dx:0, dy:-1 }; },
        emphasisIndex: -1
      };
    } else { // 'linear' — a straight run, horizontal by default
      const vbW = 640, vbH = 200;
      const leftPad = 45, rightPad = 45;
      const usable = vbW - leftPad - rightPad;
      const cy = 115;
      const N = LINE.N;

      geo = {
        viewBox: '0 0 ' + vbW + ' ' + vbH,
        labelX: vbW / 2, labelYMain: 52, labelYSub: 76,
        labelFontSize: 42, subLabelFontSize: 15,
        hasClosingSegment: false,
        closingPair: null,
        stationPos(i){
          const x = N > 1 ? leftPad + (i/(N-1)) * usable : leftPad;
          return { x, y: cy };
        },
        outwardDir(){ return { dx: 0, dy: -1 }; },
        emphasisIndex: -1
      };
    }

    svg.setAttribute('viewBox', geo.viewBox);
  }

  function drawDiagram(){
    svg.innerHTML = '';
    const ns = 'http://www.w3.org/2000/svg';
    const N = LINE.N;
    const positions = [];
    for(let i=0;i<N;i++) positions.push(geo.stationPos(i));

    const c = isLight
      ? { pending: '#d9d5c8', dot: '#c7c2b2', ink: '#17181c', inkDim: '#6b6d76' }
      : { pending: '#2c2e37', dot: '#3a3d47', ink: '#F4F2EA', inkDim: '#9a9ba3' };
    // pale line colors (Circle's yellow, H&C's pink, Waterloo & City's teal)
    // wash out against a white panel, so light mode gets the same darkened
    // variant already used for accent-ink text; dark mode keeps the vivid
    // brand color, which reads fine against a near-black panel
    const done = isLight ? darkenForLightMode(LINE.def.color) : LINE.def.color;
    const current = '#E32017';
    const okColor = isLight ? '#1E8A46' : '#7CCB6B', badColor = '#E32017';

    const curOrig = idx < totalSteps() ? currentTargetIndex() : -1;

    // for branching lines: draw the whole real network faintly first, so
    // the shape of the branches is always visible even though only one
    // route's progress is being tracked at a time
    if(geo.networkEdges){
      const routeSet = new Set(LINE.stations);
      geo.networkEdges.forEach(([a,b]) => {
        const seg = document.createElementNS(ns,'line');
        seg.setAttribute('x1',a.x); seg.setAttribute('y1',a.y);
        seg.setAttribute('x2',b.x); seg.setAttribute('y2',b.y);
        seg.setAttribute('stroke', c.pending);
        seg.setAttribute('stroke-width', 2);
        seg.setAttribute('stroke-linecap','round');
        seg.setAttribute('opacity', '0.55');
        svg.appendChild(seg);
      });
      geo.networkStations.forEach(({name,x,y}) => {
        if(routeSet.has(name)) return; // drawn normally in the main loop below
        const dot = document.createElementNS(ns,'circle');
        dot.setAttribute('cx', x); dot.setAttribute('cy', y);
        dot.setAttribute('r', 2.6);
        dot.setAttribute('fill', c.dot);
        dot.setAttribute('opacity', '0.6');
        svg.appendChild(dot);
      });
    }

    for(let i=0;i<N-1;i++){
      const a = positions[i], b = positions[i+1];
      const bothVisited = (results[i] !== undefined) && (results[i+1] !== undefined);
      const seg = document.createElementNS(ns,'line');
      seg.setAttribute('x1',a.x); seg.setAttribute('y1',a.y);
      seg.setAttribute('x2',b.x); seg.setAttribute('y2',b.y);
      seg.setAttribute('stroke', bothVisited ? done : c.pending);
      seg.setAttribute('stroke-width', 3);
      seg.setAttribute('stroke-linecap','round');
      svg.appendChild(seg);
    }

    // closing segment: only for lines whose loop physically closes
    // (e.g. Circle's Bayswater connects directly back to Paddington)
    if(geo.hasClosingSegment){
      const [ia, ib] = geo.closingPair;
      const a = positions[ia], b = positions[ib];
      const bothVisited = (results[ia] !== undefined) && (results[ib] !== undefined);
      const seg = document.createElementNS(ns,'line');
      seg.setAttribute('x1',a.x); seg.setAttribute('y1',a.y);
      seg.setAttribute('x2',b.x); seg.setAttribute('y2',b.y);
      seg.setAttribute('stroke', bothVisited ? done : c.pending);
      seg.setAttribute('stroke-width', 3);
      seg.setAttribute('stroke-linecap','round');
      svg.appendChild(seg);
    }

    for(let i=0;i<N;i++){
      const p = positions[i];
      const result = results[i];

      const dot = document.createElementNS(ns,'circle');
      dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y);
      let fill = c.dot, radius = 3.2;
      if(i === geo.emphasisIndex){ radius = 4; }
      if(result !== undefined){ fill = done; radius = Math.max(radius, 3.6); }
      if(i === curOrig){ fill = current; radius = 5.5; }
      dot.setAttribute('r', radius);
      dot.setAttribute('fill', fill);
      if(i === curOrig){
        const pulse = document.createElementNS(ns,'animate');
        pulse.setAttribute('attributeName','r');
        pulse.setAttribute('values', '5.5;7.5;5.5');
        pulse.setAttribute('dur','1.4s');
        pulse.setAttribute('repeatCount','indefinite');
        dot.appendChild(pulse);
      }
      svg.appendChild(dot);

      // tick / cross marks: shows exactly which stations were answered
      // correctly vs missed, offset outward so they never overlap the line
      if(result !== undefined){
        const dir = geo.outwardDir(i);
        const off = 10.5;
        const gx = p.x + dir.dx*off;
        const gy = p.y + dir.dy*off;
        const mark = document.createElementNS(ns,'text');
        mark.setAttribute('x', gx); mark.setAttribute('y', gy);
        mark.setAttribute('text-anchor','middle');
        mark.setAttribute('dominant-baseline','middle');
        mark.setAttribute('font-family',"'P22 Underground', 'Cabin', sans-serif");
        mark.setAttribute('font-size','9');
        mark.setAttribute('fill', result === 'ok' ? okColor : badColor);
        mark.textContent = result === 'ok' ? '✓' : '✕';
        svg.appendChild(mark);
      }
    }

    const label = document.createElementNS(ns,'text');
    label.setAttribute('x', geo.labelX); label.setAttribute('y', geo.labelYMain);
    label.setAttribute('text-anchor','middle');
    label.setAttribute('font-family',"'P22 Underground', 'Cabin', sans-serif");
    label.setAttribute('font-weight','400');
    label.setAttribute('font-size', geo.labelFontSize);
    label.setAttribute('fill', c.ink);
    label.textContent = idx;
    svg.appendChild(label);

    const label2 = document.createElementNS(ns,'text');
    label2.setAttribute('x', geo.labelX); label2.setAttribute('y', geo.labelYSub);
    label2.setAttribute('text-anchor','middle');
    label2.setAttribute('font-family',"'P22 Underground', 'Cabin', sans-serif");
    label2.setAttribute('font-size', geo.subLabelFontSize);
    label2.setAttribute('fill', c.inkDim);
    label2.textContent = 'of ' + N;
    svg.appendChild(label2);
  }

  updateDirectionLabels();
  applyLineTheme();
  setupGeometry();
  setMode('warmup');
})();
</script>
</body>
</html>
